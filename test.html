<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test in progress — Sports & Exercise Science</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10161A; --chalk:#F6F4EE; --go:#C6FF3D; --go-ink:#0F1A02;
    --slate:#93A0A6; --danger:#FF6B57; --danger-ink:#4A0F09;
    --font-display:'Big Shoulders Display','Inter',sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--ink); color:#fff; font-family:var(--font-body); min-height:100vh;}
  .topbar{
    position:sticky; top:0; background:#10161A; border-bottom:1px solid #26303580;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px; z-index:5;
  }
  .topbar .title{font-family:var(--font-display); font-weight:700; font-size:18px;}
  .topbar .meta{color:var(--slate); font-size:13px; margin-top:2px;}
  .timer{font-family:var(--font-display); font-weight:800; font-size:26px; color:var(--go);}
  .timer.low{color:var(--danger);}
  .flags{font-size:12px; color:var(--slate); text-align:right; margin-top:2px;}

  main{max-width:720px; margin:0 auto; padding:40px 24px 100px;}
  .q{background:var(--chalk); color:var(--ink); border-radius:14px; padding:26px 28px; margin-bottom:20px;}
  .q .num{font-size:12px; font-weight:700; color:#6B7580; margin-bottom:8px;}
  .q .text{font-size:17px; font-weight:600; margin-bottom:18px; line-height:1.4;}
  .opt{
    display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:9px;
    border:1.5px solid #D8D4C8; margin-bottom:10px; cursor:pointer; transition:border-color .12s;
  }
  .opt:hover{border-color:#B7B29F;}
  .opt input{accent-color:var(--ink);}
  .opt.selected{border-color:var(--ink); background:#EFEADA;}

  #submitBtn{
    width:100%; max-width:720px; margin:0 auto; display:block;
    padding:16px 20px; border:none; border-radius:9px; background:var(--go); color:var(--go-ink);
    font-family:var(--font-display); font-weight:700; font-size:19px; cursor:pointer;
  }
  #submitBtn:disabled{background:#4A4A3E; color:#8C8674; cursor:not-allowed;}

  .gate{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .gate h1{font-family:var(--font-display); font-size:36px; margin-bottom:12px;}
  .gate p{color:#C8D0D4; max-width:48ch; line-height:1.5; margin-bottom:28px;}
  .gate button{
    padding:16px 32px; border:none; border-radius:9px; background:var(--go); color:var(--go-ink);
    font-family:var(--font-display); font-weight:700; font-size:18px; cursor:pointer;
  }

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    background:var(--danger); color:#fff; padding:10px 18px; border-radius:8px;
    font-size:13.5px; font-weight:600; z-index:10; display:none;
  }
  .done{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px;}
  .done h1{font-family:var(--font-display); font-size:40px; margin-bottom:8px;}
  .done p{color:var(--slate);}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="gate" id="gateScreen">
  <h1>Ready to begin?</h1>
  <p id="gateInfo">Loading your test…</p>
  <button id="beginBtn" disabled>Enter full-screen &amp; begin</button>
</div>

<div id="examScreen" style="display:none;">
  <div class="topbar">
    <div>
      <div class="title" id="testTitle"></div>
      <div class="meta" id="studentMeta"></div>
    </div>
    <div style="text-align:right;">
      <div class="timer" id="timer">--:--</div>
      <div class="flags" id="flagDisplay">0 / 3 flags</div>
    </div>
  </div>
  <main id="questionList"></main>
  <div style="max-width:720px; margin:0 auto; padding:0 24px 40px;">
    <button id="submitBtn">Submit test</button>
  </div>
</div>

<div class="done" id="doneScreen" style="display:none;">
  <h1 id="doneHeadline">Submitted</h1>
  <p id="doneSub">You can close this window now.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const MAX_FLAGS = 3;
let flags = 0;
let submitted = false;
let testDef = null;
let session = null;
let timerInterval = null;
let secondsLeft = 0;
let answers = {};

const toastEl = document.getElementById('toast');
function toast(msg){
  toastEl.textContent = msg;
  toastEl.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.style.display = 'none', 3500);
}

// --- Load session + test definition ---
try {
  session = JSON.parse(sessionStorage.getItem('examSession'));
} catch (e) { session = null; }

if (!session || !session.testId) {
  document.getElementById('gateInfo').textContent = 'No active session found. Please start the test from the home page.';
} else {
  fetch(`data/tests/${session.testId}.json`)
    .then(r => r.json())
    .then(data => {
      testDef = data;
      document.getElementById('gateInfo').textContent =
        `${testDef.title} — ${testDef.durationMinutes} minutes, ${testDef.questions.length} questions. ` +
        `Signed in as ${session.name} (${session.roll}).`;
      document.getElementById('beginBtn').disabled = false;
    })
    .catch(() => {
      document.getElementById('gateInfo').textContent = 'Could not load this test. Please tell your teacher.';
    });
}

document.getElementById('beginBtn').addEventListener('click', async () => {
  try {
    await document.documentElement.requestFullscreen();
  } catch (e) {
    toast('Full-screen is required to start the test.');
    return;
  }
  startExam();
});

function startExam(){
  document.getElementById('gateScreen').style.display = 'none';
  document.getElementById('examScreen').style.display = 'block';
  document.getElementById('testTitle').textContent = testDef.title;
  document.getElementById('studentMeta').textContent =
    `${session.name} · ${session.roll} · ${session.className}`;

  renderQuestions();
  secondsLeft = testDef.durationMinutes * 60;
  updateTimer();
  timerInterval = setInterval(() => {
    secondsLeft--;
    updateTimer();
    if (secondsLeft <= 0) submitTest('time_up');
  }, 1000);

  attachMonitoring();
}

function updateTimer(){
  const m = Math.max(0, Math.floor(secondsLeft / 60));
  const s = Math.max(0, secondsLeft % 60);
  const el = document.getElementById('timer');
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.classList.toggle('low', secondsLeft <= 60);
}

function renderQuestions(){
  const list = document.getElementById('questionList');
  list.innerHTML = '';
  testDef.questions.forEach((q, i) => {
    const div = document.createElement('div');
    div.className = 'q';
    div.innerHTML = `
      <div class="num">Question ${i + 1} of ${testDef.questions.length}</div>
      <div class="text">${q.text}</div>
      <div class="opts"></div>
    `;
    const optsWrap = div.querySelector('.opts');
    q.options.forEach((opt, idx) => {
      const label = document.createElement('label');
      label.className = 'opt';
      label.innerHTML = `<input type="radio" name="${q.id}" value="${idx}"> <span>${opt}</span>`;
      label.addEventListener('click', () => {
        answers[q.id] = idx;
        optsWrap.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
        label.classList.add('selected');
      });
      optsWrap.appendChild(label);
    });
    list.appendChild(div);
  });
}

// --- Monitoring: tab switch, fullscreen exit, copy/paste ---
function flag(reason){
  if (submitted) return;
  flags++;
  document.getElementById('flagDisplay').textContent = `${flags} / ${MAX_FLAGS} flags`;
  toast(`Flagged: ${reason} (${flags}/${MAX_FLAGS})`);
  if (flags >= MAX_FLAGS) submitTest('flag_limit');
}

function attachMonitoring(){
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && !submitted) flag('tab switched or window minimized');
  });
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && !submitted) flag('exited full-screen');
  });
  document.addEventListener('copy', () => flag('copy'));
  document.addEventListener('paste', () => flag('paste'));
}

document.getElementById('submitBtn').addEventListener('click', () => submitTest('manual'));

async function submitTest(reason){
  if (submitted) return;
  submitted = true;
  clearInterval(timerInterval);
  document.getElementById('submitBtn').disabled = true;

  let score = 0;
  testDef.questions.forEach(q => {
    if (answers[q.id] === q.correctIndex) score++;
  });

  const payload = {
    testId: testDef.id,
    testTitle: testDef.title,
    className: session.className,
    name: session.name,
    roll: session.roll,
    answers,
    score,
    maxScore: testDef.questions.length,
    flags,
    submitReason: reason,
    submittedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  try {
    await db.collection('results').add(payload);
  } catch (e) {
    toast('Could not save your result — check your connection.');
  }

  if (document.fullscreenElement) {
    try { await document.exitFullscreen(); } catch (e) {}
  }

  document.getElementById('examScreen').style.display = 'none';
  document.getElementById('doneScreen').style.display = 'flex';
  document.getElementById('doneHeadline').textContent =
    reason === 'flag_limit' ? 'Auto-submitted' : reason === 'time_up' ? "Time's up" : 'Submitted';
  document.getElementById('doneSub').textContent =
    reason === 'flag_limit'
      ? 'Your test was auto-submitted after repeated full-screen exits or tab switches.'
      : 'Your answers have been recorded. You can close this window now.';
}
</script>
</body>
</html>
