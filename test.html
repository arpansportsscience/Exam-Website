<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test in progress — Sports & Exercise Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 24px; background:rgba(19,42,61,0.94); backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(255,177,0,0.18);
  }
  .topbar .title{font-family:var(--font-display);font-weight:700;font-size:16px;}
  .topbar .stats{display:flex;gap:20px;font-size:13px;color:#C3D2DA;}
  .topbar .stats b{color:var(--amber);font-family:var(--font-display);font-size:16px;}
  #timeStat{transition:color .2s ease;}
  .time-warn{color:var(--danger) !important;}
  .time-critical{color:var(--danger) !important;animation:pulse-beat 1s ease-in-out infinite;}
  .flagnum{color:var(--danger) !important;}
  .progress-track{height:5px;background:rgba(255,255,255,0.08);}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--go),var(--amber));transition:width .3s ease;}
  main{max-width:760px;margin:0 auto;padding:32px 24px 100px;}
  .q{background:var(--chalk);color:var(--ink);border-radius:var(--radius);padding:24px;margin-bottom:18px;}
  .q .qhead{display:flex;justify-content:space-between;font-size:12.5px;color:#6B7478;margin-bottom:10px;font-weight:600;}
  .q .qtext{font-size:16px;font-weight:600;margin-bottom:16px;line-height:1.4;}
  .opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1.5px solid #E4D9C4;border-radius:9px;margin-bottom:8px;cursor:pointer;}
  .opt:hover{border-color:var(--go);}
  .opt input{width:auto;margin-top:3px;}
  .opt.selected{border-color:var(--go);background:#FFEDE9;}
  #gate{max-width:560px;margin:80px auto;text-align:center;}
  #gate .card{text-align:left;}
  #submitBar{position:sticky;bottom:0;background:rgba(19,42,61,0.96);backdrop-filter:blur(6px);padding:18px 24px;border-top:1px solid rgba(255,177,0,0.18);text-align:center;}
  #submitBar .btn{max-width:320px;}
  .toast{
    position:fixed; top:70px; right:20px; z-index:60;
    background:var(--danger); color:#fff; padding:12px 18px; border-radius:9px;
    font-size:13.5px; font-weight:600; box-shadow:0 12px 30px -10px rgba(0,0,0,0.5);
    max-width:300px;
  }
  #doneScreen{max-width:520px;margin:100px auto;text-align:center;}
  .check-draw circle,.check-draw path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw-check .6s ease forwards;}
  .check-draw path{animation-delay:.5s;}
  @keyframes draw-check{to{stroke-dashoffset:0;}}
</style>
</head>
<body>

<div id="gate" style="display:none;">
  <div class="card">
    <h2 id="gateTitle" style="margin-bottom:6px;"></h2>
    <p class="lede" style="margin-top:6px;">Once you click begin, this test locks into full-screen and starts its timer immediately. Do not switch tabs, minimize, exit full-screen, or copy/paste — each is logged as a flag.</p>
    <p style="font-size:13.5px;color:#4B5559;"><b id="gateDuration"></b> minutes &middot; up to <b id="gateFlags"></b> flags allowed before auto-submit</p>
    <button id="beginBtn" class="btn btn-primary btn-block" style="margin-top:20px;font-family:var(--font-display);font-size:18px;">Begin full-screen test</button>
    <div id="gateErr" class="banner error"></div>
  </div>
</div>

<div id="examWrap" style="display:none;">
  <div class="topbar">
    <span class="title" id="examTitle"></span>
    <div class="stats">
      <span>Flags: <b class="flagnum" id="flagStat">0</b>/<span id="flagMax"></span></span>
      <span>Time: <b id="timeStat">--:--</b></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <main id="questionsWrap"></main>
  <div id="submitBar">
    <button id="submitBtn" class="btn btn-primary btn-block" style="font-family:var(--font-display);font-size:17px;">Submit test</button>
  </div>
</div>

<div class="modal-backdrop" id="confirmModal">
  <div class="modal">
    <h2>Submit test?</h2>
    <p class="sub" id="confirmSummary"></p>
    <div class="modal-actions">
      <button id="confirmCancel" type="button" class="btn btn-outline">Keep working</button>
      <button id="confirmSubmit" type="button" class="btn btn-primary">Submit now</button>
    </div>
  </div>
</div>

<div id="doneScreen" style="display:none;">
  <div class="card" style="text-align:center;">
    <svg class="check-draw" viewBox="0 0 52 52" width="64" height="64" style="margin:0 auto 14px;display:block;">
      <circle cx="26" cy="26" r="24" fill="none" stroke="var(--go)" stroke-width="3" pathLength="1"/>
      <path fill="none" stroke="var(--go)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M14 27 l8 8 16-16" pathLength="1"/>
    </svg>
    <h2>Test submitted</h2>
    <p class="lede" id="doneSummary" style="margin:12px auto 0;color:#4B5559;"></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script>
const session = JSON.parse(sessionStorage.getItem('examSession') || 'null');
if (!session || !session.testId) {
  window.location.href = 'index.html';
}

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let test = null;
let flagCount = 0;
let timeLeftSec = 0;
let totalTimeSec = 0;
let timerHandle = null;
let submitted = false;
let started = false;

const gate = document.getElementById('gate');
const gateErr = document.getElementById('gateErr');
const examWrap = document.getElementById('examWrap');
const questionsWrap = document.getElementById('questionsWrap');
const doneScreen = document.getElementById('doneScreen');
const flagStat = document.getElementById('flagStat');
const timeStat = document.getElementById('timeStat');

firebase.auth().onAuthStateChanged(user => {
  if (!user) { window.location.href = 'index.html'; return; }
  loadTest();
});

function loadTest(){
  db.collection('tests').doc(session.testId).get().then(doc => {
    if (!doc.exists || doc.data().open !== true) {
      showGateError('This test is not available anymore. Please tell your teacher.');
      return;
    }
    test = { id: doc.id, ...doc.data() };
    document.getElementById('gateTitle').textContent = test.title;
    document.getElementById('gateDuration').textContent = test.durationMinutes;
    document.getElementById('gateFlags').textContent = test.maxViolations;
    document.getElementById('examTitle').textContent = test.title;
    document.getElementById('flagMax').textContent = test.maxViolations;
    timeLeftSec = test.durationMinutes * 60;
    totalTimeSec = timeLeftSec;
    gate.style.display = 'block';
  }).catch(e => showGateError('Could not load the test (' + e.message + ').'));
}
function showGateError(msg){
  gateErr.textContent = msg;
  gateErr.style.display = 'flex';
  gate.style.display = 'block';
}

document.getElementById('beginBtn').addEventListener('click', async () => {
  try {
    await document.documentElement.requestFullscreen();
  } catch (e) {
    gateErr.textContent = 'Full-screen was blocked by your browser. Allow full-screen and try again.';
    gateErr.style.display = 'flex';
    return;
  }
  started = true;
  gate.style.display = 'none';
  examWrap.style.display = 'block';
  renderQuestions();
  startTimer();
  attachProctoring();
});

function renderQuestions(){
  let html = '';
  (test.mcq || []).forEach((q, qi) => {
    html += `<div class="q" data-type="mcq" data-qi="${qi}">
      <div class="qhead"><span>MCQ ${qi+1}</span><span>${q.marks} mark${q.marks==1?'':'s'}</span></div>
      <div class="qtext">${escapeHtml(q.text)}</div>
      ${q.options.map((opt, oi) => `
        <label class="opt" data-oi="${oi}">
          <input type="radio" name="mcq${qi}" value="${oi}">
          <span>${escapeHtml(opt)}</span>
        </label>`).join('')}
    </div>`;
  });
  (test.shortAnswer || []).forEach((q, qi) => {
    html += `<div class="q" data-type="sa" data-qi="${qi}">
      <div class="qhead"><span>Short answer ${qi+1}</span><span>${q.marks} mark${q.marks==1?'':'s'}</span></div>
      <div class="qtext">${escapeHtml(q.text)}</div>
      <textarea data-sa="${qi}" placeholder="Type your answer…"></textarea>
    </div>`;
  });
  questionsWrap.innerHTML = html;

  questionsWrap.querySelectorAll('.opt').forEach(optEl => {
    optEl.addEventListener('click', () => {
      const group = optEl.closest('.q').querySelectorAll('.opt');
      group.forEach(g => g.classList.remove('selected'));
      optEl.classList.add('selected');
      optEl.querySelector('input').checked = true;
      updateProgress();
    });
  });
  questionsWrap.querySelectorAll('textarea').forEach(ta => ta.addEventListener('input', updateProgress));
  updateProgress();
}
function updateProgress(){
  const totalQ = (test.mcq || []).length + (test.shortAnswer || []).length;
  if (totalQ === 0) return;
  let answered = questionsWrap.querySelectorAll('input[type="radio"]:checked').length;
  questionsWrap.querySelectorAll('textarea').forEach(ta => { if (ta.value.trim()) answered++; });
  document.getElementById('progressFill').style.width = Math.round((answered / totalQ) * 100) + '%';
}
function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s ?? '';
  return d.innerHTML;
}

function startTimer(){
  updateTimeDisplay();
  timerHandle = setInterval(() => {
    timeLeftSec--;
    updateTimeDisplay();
    if (timeLeftSec <= 0) {
      clearInterval(timerHandle);
      submitTest(true, 'Time expired');
    }
  }, 1000);
}
function updateTimeDisplay(){
  const m = Math.max(0, Math.floor(timeLeftSec / 60));
  const s = Math.max(0, timeLeftSec % 60);
  timeStat.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const frac = totalTimeSec ? timeLeftSec / totalTimeSec : 1;
  timeStat.classList.remove('time-warn', 'time-critical');
  if (frac <= 0.15) timeStat.classList.add('time-critical');
  else if (frac <= 0.4) timeStat.classList.add('time-warn');
}

function raiseFlag(reason){
  if (submitted || !started) return;
  flagCount++;
  flagStat.textContent = flagCount;
  flagStat.classList.add('pulse');
  setTimeout(() => flagStat.classList.remove('pulse'), 500);
  showToast('Flag ' + flagCount + '/' + test.maxViolations + ': ' + reason);
  if (flagCount >= test.maxViolations) {
    submitTest(true, 'Flag limit reached');
  }
}
function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function attachProctoring(){
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) raiseFlag('Tab switched or window minimized');
  });
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && started && !submitted) raiseFlag('Exited full-screen');
  });
  window.addEventListener('blur', () => raiseFlag('Window lost focus'));
  document.addEventListener('contextmenu', e => { e.preventDefault(); raiseFlag('Right-click'); });
  ['copy','cut','paste'].forEach(evt =>
    document.addEventListener(evt, e => { e.preventDefault(); raiseFlag('Copy/paste attempt'); })
  );
  document.addEventListener('keydown', e => {
    const blocked =
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) ||
      (e.ctrlKey && e.key.toUpperCase() === 'U');
    if (blocked) { e.preventDefault(); raiseFlag('Dev tools shortcut'); }
  });
  window.addEventListener('beforeunload', (e) => {
    if (!submitted) { e.preventDefault(); e.returnValue = ''; }
  });
}

document.getElementById('submitBtn').addEventListener('click', () => {
  const totalQ = (test.mcq || []).length + (test.shortAnswer || []).length;
  let answered = questionsWrap.querySelectorAll('input[type="radio"]:checked').length;
  questionsWrap.querySelectorAll('textarea').forEach(ta => { if (ta.value.trim()) answered++; });
  const unanswered = totalQ - answered;
  document.getElementById('confirmSummary').textContent = unanswered > 0
    ? `You've answered ${answered} of ${totalQ} questions. ${unanswered} will be left blank.`
    : `You've answered all ${totalQ} questions.`;
  document.getElementById('confirmModal').classList.add('open');
});
document.getElementById('confirmCancel').addEventListener('click', () => {
  document.getElementById('confirmModal').classList.remove('open');
});
document.getElementById('confirmSubmit').addEventListener('click', () => {
  document.getElementById('confirmModal').classList.remove('open');
  submitTest(false, 'Manual submit');
});

async function submitTest(auto, reason){
  if (submitted) return;
  submitted = true;
  clearInterval(timerHandle);

  let mcqScore = 0, maxMcqScore = 0;
  const mcqAnswers = [];
  (test.mcq || []).forEach((q, qi) => {
    maxMcqScore += q.marks;
    const checked = questionsWrap.querySelector(`input[name="mcq${qi}"]:checked`);
    const sel = checked ? parseInt(checked.value, 10) : null;
    mcqAnswers.push(sel);
    if (sel !== null && sel === q.correctIndex) mcqScore += q.marks;
  });

  const shortAnswers = [];
  (test.shortAnswer || []).forEach((q, qi) => {
    const ta = questionsWrap.querySelector(`textarea[data-sa="${qi}"]`);
    shortAnswers.push({ text: ta ? ta.value.trim() : '', marks: null });
  });

  const result = {
    studentUid: firebase.auth().currentUser.uid,
    name: session.name,
    roll: session.roll,
    className: session.className,
    testId: test.id,
    testTitle: test.title,
    mcqAnswers,
    mcqScore,
    maxMcqScore,
    shortAnswers,
    flagCount,
    maxViolations: test.maxViolations,
    autoSubmitted: auto,
    submitReason: reason,
    graded: (test.shortAnswer || []).length === 0,
    shortAnswerTotal: 0,
    totalScore: mcqScore,
    submittedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  try {
    await db.collection('results').add(result);
  } catch (e) {
    console.error('submit failed:', e);
    showToast('Could not save your result — check your connection and try again.');
    submitted = false;
    if (!auto) return;
  }

  sessionStorage.removeItem('examSession');
  if (document.fullscreenElement) { try { await document.exitFullscreen(); } catch(e){} }
  examWrap.style.display = 'none';
  document.getElementById('doneSummary').textContent = (test.shortAnswer || []).length > 0
    ? `Auto-graded score: ${mcqScore}/${maxMcqScore} (multiple choice only). Your short answers will be graded by your teacher.`
    : `Your score: ${mcqScore}/${maxMcqScore}. You can close this window now.`;
  doneScreen.style.display = 'block';
}
</script>
</body>
</html>
