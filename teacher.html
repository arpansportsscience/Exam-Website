<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher panel — Sports & Exercise Science</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10161A; --chalk:#F6F4EE; --go:#C6FF3D; --go-ink:#0F1A02; --slate:#93A0A6;
    --font-display:'Big Shoulders Display','Inter',sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--ink); color:#fff; font-family:var(--font-body); min-height:100vh;}
  .wrap{max-width:900px; margin:0 auto; padding:56px 24px 100px;}
  h1{font-family:var(--font-display); font-weight:800; font-size:40px; margin:0 0 6px;}
  .sub{color:var(--slate); margin-bottom:36px;}
  section{background:var(--chalk); color:var(--ink); border-radius:14px; padding:30px; margin-bottom:28px;}
  section h2{font-family:var(--font-display); font-weight:700; font-size:22px; margin:0 0 18px;}
  label{display:block; font-size:13px; font-weight:600; color:#4B5559; margin-bottom:6px;}
  input, select, textarea{
    width:100%; padding:11px 12px; font-size:14.5px; font-family:var(--font-body);
    border:1.5px solid #D8D4C8; border-radius:8px; background:#fff; color:var(--ink); margin-bottom:16px;
  }
  .row{display:grid; grid-template-columns:2fr 1fr 1fr; gap:14px;}
  @media (max-width:640px){ .row{grid-template-columns:1fr;} }
  .qcard{border:1.5px solid #D8D4C8; border-radius:10px; padding:16px; margin-bottom:14px;}
  .qcard .optrow{display:grid; grid-template-columns:24px 1fr; gap:10px; align-items:center; margin-bottom:8px;}
  .qcard .optrow input[type="radio"]{width:auto; margin:0;}
  .qcard .optrow input[type="text"]{margin:0;}
  button{
    padding:12px 20px; border:none; border-radius:8px; font-family:var(--font-display);
    font-weight:700; font-size:15px; cursor:pointer;
  }
  .btn-primary{background:var(--go); color:var(--go-ink);}
  .btn-ghost{background:transparent; border:1.5px solid var(--ink); color:var(--ink);}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
  pre{background:#0E1418; color:#C6FF3D; padding:16px; border-radius:8px; overflow:auto; font-size:12.5px; max-height:260px;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th, td{text-align:left; padding:9px 10px; border-bottom:1px solid #E2DECF;}
  th{font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:#6B7580;}
  .gate{display:flex; flex-direction:column; gap:12px; max-width:340px;}
  .flag-warn{color:#8A2E22; font-size:12.5px; margin-top:-6px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Teacher panel</h1>
  <p class="sub">Add tests and review results.</p>

  <section id="loginSection">
    <h2>Sign in</h2>
    <div class="gate">
      <div>
        <label for="email">Email</label>
        <input type="email" id="email">
      </div>
      <div>
        <label for="pass">Password</label>
        <input type="password" id="pass">
      </div>
      <div id="loginErr" class="flag-warn" style="display:none;"></div>
      <button class="btn-primary" id="loginBtn">Sign in</button>
    </div>
  </section>

  <div id="appSections" style="display:none;">

    <section>
      <h2>Add a test</h2>
      <div class="row">
        <div>
          <label for="tTitle">Test title</label>
          <input type="text" id="tTitle" placeholder="e.g. Biomechanics — Mid Term">
        </div>
        <div>
          <label for="tClass">Class</label>
          <select id="tClass">
            <option>First Year</option>
            <option>Second Year</option>
            <option>Third Year</option>
          </select>
        </div>
        <div>
          <label for="tDuration">Duration (min)</label>
          <input type="number" id="tDuration" value="45">
        </div>
      </div>
      <label for="tId">Test ID (used in the file name — lowercase, no spaces)</label>
      <input type="text" id="tId" placeholder="e.g. y2-biomech-mid">

      <div id="qList"></div>
      <div class="btn-row">
        <button class="btn-ghost" id="addQBtn">+ Add question</button>
      </div>

      <div class="btn-row" style="margin-top:22px;">
        <button class="btn-primary" id="buildBtn">Generate files</button>
      </div>

      <div id="buildOutput" style="display:none; margin-top:20px;">
        <label>1. Save this as <code id="fileName"></code> in <code>data/tests/</code></label>
        <pre id="testJsonOut"></pre>
        <div class="btn-row" style="margin-bottom:20px;">
          <button class="btn-ghost" id="downloadJsonBtn">Download this file</button>
        </div>
        <label>2. Add this entry to <code>data/tests/manifest.json</code>, then commit and push both files</label>
        <pre id="manifestOut"></pre>
      </div>
    </section>

    <section>
      <h2>Results</h2>
      <div class="btn-row" style="margin-bottom:18px;">
        <button class="btn-ghost" id="refreshBtn">Refresh</button>
        <button class="btn-primary" id="exportBtn">Export CSV</button>
      </div>
      <table id="resultsTable">
        <thead>
          <tr><th>Name</th><th>Roll</th><th>Class</th><th>Test</th><th>Score</th><th>Flags</th><th>Submitted</th></tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </section>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let currentResults = [];

// --- Auth gate ---
document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  const errEl = document.getElementById('loginErr');
  errEl.style.display = 'none';
  try {
    await firebase.auth().signInWithEmailAndPassword(email, pass);
  } catch (e) {
    errEl.textContent = 'Sign-in failed: ' + e.message;
    errEl.style.display = 'block';
  }
});

firebase.auth().onAuthStateChanged(user => {
  const signedIn = !!user && !user.isAnonymous;
  document.getElementById('loginSection').style.display = signedIn ? 'none' : 'block';
  document.getElementById('appSections').style.display = signedIn ? 'block' : 'none';
  if (signedIn) loadResults();
});

// --- Question builder ---
let qCount = 0;
function addQuestion(){
  qCount++;
  const id = 'q' + qCount;
  const div = document.createElement('div');
  div.className = 'qcard';
  div.dataset.qid = id;
  div.innerHTML = `
    <label>Question ${qCount}</label>
    <input type="text" class="qtext" placeholder="Question text">
    ${[0,1,2,3].map(i => `
      <div class="optrow">
        <input type="radio" name="correct_${id}" value="${i}" ${i===0 ? 'checked' : ''}>
        <input type="text" class="opt" placeholder="Option ${i+1}">
      </div>
    `).join('')}
  `;
  document.getElementById('qList').appendChild(div);
}
document.getElementById('addQBtn').addEventListener('click', addQuestion);
addQuestion(); addQuestion(); addQuestion();

document.getElementById('buildBtn').addEventListener('click', () => {
  const id = document.getElementById('tId').value.trim();
  const title = document.getElementById('tTitle').value.trim();
  const className = document.getElementById('tClass').value;
  const durationMinutes = parseInt(document.getElementById('tDuration').value, 10) || 45;

  if (!id || !title) { alert('Give the test an ID and a title first.'); return; }

  const questions = [];
  document.querySelectorAll('.qcard').forEach(card => {
    const text = card.querySelector('.qtext').value.trim();
    const opts = Array.from(card.querySelectorAll('.opt')).map(o => o.value.trim());
    const correctRadio = card.querySelector(`input[type="radio"]:checked`);
    const correctIndex = correctRadio ? parseInt(correctRadio.value, 10) : 0;
    if (text && opts.every(o => o)) {
      questions.push({ id: card.dataset.qid, text, options: opts, correctIndex });
    }
  });

  if (questions.length === 0) { alert('Add at least one complete question.'); return; }

  const testDef = { id, title, className, durationMinutes, questions };
  const testJson = JSON.stringify(testDef, null, 2);
  const manifestEntry = JSON.stringify({ id, title, className }, null, 2);

  document.getElementById('fileName').textContent = `data/tests/${id}.json`;
  document.getElementById('testJsonOut').textContent = testJson;
  document.getElementById('manifestOut').textContent = manifestEntry;
  document.getElementById('buildOutput').style.display = 'block';

  document.getElementById('downloadJsonBtn').onclick = () => {
    const blob = new Blob([testJson], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${id}.json`;
    a.click();
  };
});

// --- Results ---
async function loadResults(){
  const tbody = document.getElementById('resultsBody');
  tbody.innerHTML = '<tr><td colspan="7">Loading…</td></tr>';
  const snap = await db.collection('results').orderBy('submittedAt', 'desc').get();
  currentResults = snap.docs.map(d => d.data());
  tbody.innerHTML = '';
  currentResults.forEach(r => {
    const tr = document.createElement('tr');
    const when = r.submittedAt && r.submittedAt.toDate ? r.submittedAt.toDate().toLocaleString() : '—';
    tr.innerHTML = `
      <td>${r.name || ''}</td><td>${r.roll || ''}</td><td>${r.className || ''}</td>
      <td>${r.testTitle || ''}</td><td>${r.score}/${r.maxScore}</td>
      <td>${r.flags}${r.submitReason === 'flag_limit' ? ' ⚠' : ''}</td><td>${when}</td>
    `;
    tbody.appendChild(tr);
  });
  if (currentResults.length === 0) tbody.innerHTML = '<tr><td colspan="7">No results yet.</td></tr>';
}
document.getElementById('refreshBtn').addEventListener('click', loadResults);

document.getElementById('exportBtn').addEventListener('click', () => {
  const header = ['Name','Roll','Class','Test','Score','Max','Flags','Submit reason','Submitted at'];
  const rows = currentResults.map(r => [
    r.name, r.roll, r.className, r.testTitle, r.score, r.maxScore, r.flags, r.submitReason,
    r.submittedAt && r.submittedAt.toDate ? r.submittedAt.toDate().toISOString() : ''
  ]);
  const csv = [header, ...rows]
    .map(row => row.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(','))
    .join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `results-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
});
</script>
</body>
</html>
