<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script>
const classNameEl = document.getElementById('className');
const testSelect = document.getElementById('testSelect');
const startBtn = document.getElementById('startBtn');
const errEl = document.getElementById('err');
let manifest = [];
let manifestLoaded = false;

const clockEl = document.getElementById('liveClock');
function tickClock(){
  clockEl.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
tickClock();
setInterval(tickClock, 1000 * 30);

function normalizeClass(v){
  return String(v ?? '').trim().toLowerCase();
}
function entryClassName(entry){
  return entry.className ?? entry.class ?? entry.class_name ?? '';
}

/* ---- 1. Load the test manifest FIRST, independent of Firebase ---- */
fetch('data/tests/manifest.json')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(data => {
    manifest = Array.isArray(data) ? data : [];
    manifestLoaded = true;

    const classes = [...new Set(manifest.map(entryClassName).filter(Boolean))];

    if (classes.length === 0) {
      classNameEl.innerHTML = '<option value="">No tests currently open</option>';
      classNameEl.disabled = true;
      errEl.textContent = 'No tests are open for any class right now. Please tell your teacher.';
      errEl.style.display = 'flex';
      return;
    }

    classNameEl.innerHTML = '<option value="">Select your class</option>' +
      classes.map(c => `<option value="${c}">${c}</option>`).join('');
    classNameEl.disabled = false;
  })
  .catch((e) => {
    console.error('manifest load failed:', e);
    classNameEl.innerHTML = '<option value="">Could not load classes</option>';
    errEl.textContent = 'Could not load the list of tests (' + e.message + '). If you opened this file directly, ' +
      'run it through a local server instead — browsers block loading local JSON files directly.';
    errEl.style.display = 'flex';
  });

/* ---- 2. Init Firebase separately — a failure here must NOT block #1 ---- */
let firebaseReady = false;
try {
  firebase.initializeApp(firebaseConfig);
  firebaseReady = true;
} catch (e) {
  console.error('firebase init failed:', e);
  errEl.textContent = 'Could not connect to the test service. Please tell your teacher.';
  errEl.style.display = 'flex';
}

classNameEl.addEventListener('change', () => {
  const cls = classNameEl.value;
  testSelect.innerHTML = '';

  if (!cls) {
    testSelect.disabled = true;
    testSelect.innerHTML = '<option value="">Select your class first</option>';
    validate();
    return;
  }

  const clsNorm = normalizeClass(cls);
  const matches = manifest.filter(t => normalizeClass(entryClassName(t)) === clsNorm);

  if (matches.length === 0) {
    testSelect.disabled = true;
    testSelect.innerHTML = '<option value="">No tests currently open for your class</option>';
  } else {
    testSelect.disabled = false;
    testSelect.innerHTML = '<option value="">Select a test</option>' +
      matches.map(t => `<option value="${t.id}">${t.title}</option>`).join('');
  }
  validate();
});

[document.getElementById('name'), document.getElementById('roll'), testSelect].forEach(el =>
  el.addEventListener('input', validate)
);
testSelect.addEventListener('change', validate);

function validate() {
  const ok = manifestLoaded && firebaseReady &&
             document.getElementById('name').value.trim().length > 1 &&
             document.getElementById('roll').value.trim().length > 0 &&
             classNameEl.value && testSelect.value;
  startBtn.disabled = !ok;
}

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startBtn.textContent = 'Signing in…';
  errEl.style.display = 'none';
  try {
    await firebase.auth().signInAnonymously();
    const session = {
      name: document.getElementById('name').value.trim(),
      roll: document.getElementById('roll').value.trim(),
      className: classNameEl.value,
      testId: testSelect.value
    };
    sessionStorage.setItem('examSession', JSON.stringify(session));
    window.location.href = 'test.html';
  } catch (e) {
    errEl.textContent = 'Could not start a secure session (' + e.message + '). Check your connection and try again.';
    errEl.style.display = 'flex';
    startBtn.disabled = false;
    startBtn.textContent = 'Start test';
  }
});

/* ---------------- Teacher access (password-gated) ---------------- */
const teacherModal = document.getElementById('teacherModal');
const teacherLink = document.getElementById('teacherLink');
const teacherCancel = document.getElementById('teacherCancel');
const teacherSubmit = document.getElementById('teacherSubmit');
const teacherEmail = document.getElementById('teacherEmail');
const teacherPassword = document.getElementById('teacherPassword');
const teacherErr = document.getElementById('teacherErr');

function openTeacherModal(){
  teacherErr.style.display = 'none';
  teacherEmail.value = '';
  teacherPassword.value = '';
  teacherModal.classList.add('open');
  teacherEmail.focus();
}
function closeTeacherModal(){
  teacherModal.classList.remove('open');
}

teacherLink.addEventListener('click', openTeacherModal);
teacherCancel.addEventListener('click', closeTeacherModal);
teacherModal.addEventListener('click', (e) => {
  if (e.target === teacherModal) closeTeacherModal();
});
teacherPassword.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') teacherSubmit.click();
});

teacherSubmit.addEventListener('click', async () => {
  if (!firebaseReady) {
    teacherErr.textContent = 'Test service is unavailable right now.';
    teacherErr.style.display = 'block';
    return;
  }
  const email = teacherEmail.value.trim();
  const pw = teacherPassword.value;
  if (!email || !pw) {
    teacherErr.textContent = 'Enter both email and password.';
    teacherErr.style.display = 'block';
    return;
  }
  teacherSubmit.disabled = true;
  teacherSubmit.textContent = 'Signing in…';
  teacherErr.style.display = 'none';
  try {
    if (firebase.auth().currentUser) {
      await firebase.auth().signOut();
    }
    await firebase.auth().signInWithEmailAndPassword(email, pw);
    window.location.href = 'teacher.html';
  } catch (e) {
    teacherErr.textContent = 'Sign-in failed. Check your email and password.';
    teacherErr.style.display = 'block';
    teacherSubmit.disabled = false;
    teacherSubmit.textContent = 'Sign in';
  }
});
</script>
